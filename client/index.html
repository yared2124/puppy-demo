<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bootstrap</title>
    <link rel="stylesheet" href="./bootstrap.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1 class="blueBG text-center p-3 mb-0">puppy lovers page</h1>

    <section class="container">

        <div class="mb-5 col-md-4 mb-md-0">
          <img src="./images/puppy-1.jpg" alt="" />

        <div class="d-none d-md-block col-md-4 missing pr-5 pl-5 pt-5">

        </div>
        <div class="col-md-4"><img src="./images/puppy-2.jpg" alt="" /></div>
      </div>
    </section>

    <section class="text-center my-5">
      <h2 class="font-weight-bold">More puppies</h2>
    </section>

    <section class="container">
      <div class="row">
        <div class=" mb-5 col-md-6 mb-md-0"><img src="./images/puppy-3.jpg" alt="" /></div>
        <div class="col-md-6"><img src="./images/puppy-4.jpg" alt="" /></div>
      </div>
    </section>

    <footer>
      <h1 class="blueBG text-center mb-0 p-5 mt-5">Developed by: yared</h1>
    </footer>

</html>
